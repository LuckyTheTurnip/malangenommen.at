<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f19">
    <title>Mal Angenommen</title>
    <link rel="stylesheet" href="MalAngenommen.css">
</head>
<body>
    <main class="game" data-app>
        <div class="corner-dot" aria-hidden="true"></div>
        <div class="game__glow game__glow--one" aria-hidden="true"></div>
        <div class="game__glow game__glow--two" aria-hidden="true"></div>

        <header class="game__header">
            <div>
                <p class="game__eyebrow">Mal Angenommen</p>
                <h1 class="game__title">Für die nächste Karte</h1>
            </div>
            <div class="game__header-actions">
                <button class="game__filter-toggle" type="button" data-filter-toggle aria-expanded="false" aria-controls="filter-menu">Filter</button>
                <button class="game__motion-toggle" type="button" data-motion-toggle aria-pressed="false">3D Motion</button>
                <button class="game__language-toggle" type="button" data-language-toggle aria-pressed="false">English</button>
            </div>
        </header>

        <aside class="filter-menu" id="filter-menu" data-filter-menu hidden aria-hidden="true">
            <p class="filter-menu__title">Kategorien</p>
            <label class="filter-menu__option">
                <input type="checkbox" data-filter-category="hypothetical" checked>
                <span>Hypothetical</span>
            </label>
            <label class="filter-menu__option">
                <input type="checkbox" data-filter-category="showstopper" checked>
                <span>Showstopper</span>
            </label>
            <label class="filter-menu__option">
                <input type="checkbox" data-filter-category="kombichaos" checked>
                <span>Kombichaos</span>
            </label>
            <label class="filter-menu__option">
                <input type="checkbox" data-filter-category="monkeyspaw" checked>
                <span>Monkey’s Paw</span>
            </label>
            <hr class="filter-menu__divider">
            <label class="filter-menu__option">
                <input type="checkbox" data-filter-variations-only>
                <span>Nur Karten mit Variation</span>
            </label>
        </aside>

        <section class="deck-stage" data-deck-stage>
            <div class="deck-stack" aria-hidden="true">
                <article class="stack-card" data-stack-card="0"></article>
                <article class="stack-card" data-stack-card="1"></article>
                <article class="stack-card" data-stack-card="2"></article>
            </div>

            <article class="active-card" data-active-card data-card-shell="active" aria-hidden="false">
                <div class="active-card__tilt">
                    <div class="active-card__faces">
                        <div class="card-face card-face--front">
                            <div class="active-card__content">
                                <div class="active-card__topline">
                                    <span class="card-badge" data-category-label>...</span>
                                </div>

                                <div class="card-question-shell">
                                    <p class="card-question" data-front-question></p>
                                </div>

                                <div class="swipe-up-cue" data-swipe-up-cue hidden aria-hidden="true">
                                    <span class="swipe-up-cue__asset" aria-hidden="true">↑</span>
                                </div>
                            </div>
                        </div>

                        <div class="card-face card-face--back">
                            <div class="active-card__content active-card__content--back">
                                <div class="card-back-design" aria-hidden="true">
                                    <div class="card-back-orbit">
                                        <svg class="card-back-orbit-svg" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" focusable="false">
                                            <defs>
                                                <!-- Circle path (center 160,110 radius 88) -->
                                                <path id="card-back-ellipse-path" d="M 248 110 A 88 88 0 1 0 72 110 A 88 88 0 1 0 248 110"/>
                                            </defs>
                                            <text class="card-back-orbit-text">
                                                <textPath href="#card-back-ellipse-path" xlink:href="#card-back-ellipse-path" startOffset="0%">HYPOTHETICAL</textPath>
                                            </text>
                                            <text class="card-back-orbit-text">
                                                <textPath href="#card-back-ellipse-path" xlink:href="#card-back-ellipse-path" startOffset="33.333%">HYPOTHETICAL</textPath>
                                            </text>
                                            <text class="card-back-orbit-text">
                                                <textPath href="#card-back-ellipse-path" xlink:href="#card-back-ellipse-path" startOffset="66.666%">HYPOTHETICAL</textPath>
                                            </text>
                                        </svg>
                                    </div>
                                    <div class="card-back-logo-wrap">
                                        <img class="card-back-logo" src="Media/Hypothetical_Logo.svg" alt="Hypothetical logo">
                                    </div>
                                </div>
                                <div class="flip-cue" data-flip-cue hidden aria-hidden="true">
                                    <span class="flip-cue__asset" aria-hidden="true">↔</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </article>

            <section class="variation-mini-card" data-variation-card hidden aria-hidden="true">
                <div class="variation-mini-card__motion">
                    <div class="variation-mini-card__inner">
                        <p class="variation-mini-card__text" data-variation-text></p>
                        <div class="variation-mini-card__scratch" data-variation-scratch></div>
                    </div>
                </div>
            </section>
            <div class="variation-fan" data-variation-fan hidden aria-hidden="true"></div>

        </section>

        <p class="game__status" data-status aria-live="polite"></p>
    </main>

    <script src="MalAngenommen-data.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js" defer></script>
    <script src="MalAngenommen.js"></script>
</body>
</html>
